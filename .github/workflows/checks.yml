name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.8', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python evals/run_evals.py
